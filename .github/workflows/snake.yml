name: Snake

on:
  schedule:
    - cron: "0 0 * * *"   # раз в сутки
  workflow_dispatch:       # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#000000&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4d4d4d,#1a1a1a
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#3d3d3d,#6e6e6e,#a6a6a6,#e6e6e6

      # svg кладутся в отдельную ветку output, чтобы не засорять main
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
